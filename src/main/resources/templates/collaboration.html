<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Track Comparison</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Barlow', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 40%, #dee2e6 100%);
            padding-top: 170px;
        }

        /* FORM CARD */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.4);
        }

        /* INPUTS */
        .form-control {
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 1.05rem;
            border: 1px solid #ccd1d5;
            transition: .3s;
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.2);
        }

        /* BUTTON */
        .btn-custom {
            border-radius: 14px;
            padding: 12px 20px;
            font-size: 1.15rem;
            font-weight: 600;
            transition: .25s;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(25, 135, 84, .3);
        }

        /* ARTIST CARDS */
        .artist-card {
            border-radius: 22px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 8px 28px rgba(0,0,0,0.12);
            transition: .3s;
        }
        .artist-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.16);
        }
        .artist-img {
            height: 300px;
            object-fit: cover;
        }

        .artist-role {
            font-size: 1.3rem;
            font-weight: 600;
        }
        .artist-name {
            font-size: 1.05rem;
            opacity: 0.75;
        }
    </style>
</head>

<body>

<header th:insert="~{elements/header :: header}"></header>

<main class="container py-5">

    <h2 class="text-center mb-4 fw-bold" style="font-size:2rem;">
        Learn more about the collaboration between tracks
    </h2>

    <!-- FORM -->
    <form action="/collaborations" method="get" class="glass-card mb-5">
        <div class="row g-4 align-items-center justify-content-center">
            <div class="col-md-4">
                <input type="text" name="firstSongId" class="form-control" placeholder="First track ID" required>
            </div>
            <div class="col-md-4">
                <input type="text" name="secondSongId" class="form-control" placeholder="Second track ID" required>
            </div>
            <div class="col-md-3 col-lg-2 text-center">
                <button type="submit" class="btn btn-success btn-custom w-100">Compare</button>
            </div>
        </div>

        <p class="text-center text-muted mt-3 mb-0">
            Example IDs: <code>791921</code> & <code>4043785</code>
        </p>
    </form>

    <!-- ARTISTS -->
    <div class="row g-4 text-center mb-5">
        <div class="col-md-6 col-lg-4"
             th:each="artist : ${sharedArtists}">
            <div class="artist-card">
                <img th:src="${artist.get('imageUrl').asText()}" class="artist-img w-100">
                <div class="p-4">
                    <div class="artist-role" th:text="${artist.get('role').asText()}"></div>
                    <div class="artist-name" th:text="${artist.get('name').asText()}"></div>
                </div>
            </div>
        </div>
    </div>

</main>

</body>
</html>
