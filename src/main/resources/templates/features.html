<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Track Comparison</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Barlow', sans-serif;
            background-color: #f8f9fa;
            padding-top: 200px;
        }
        .track-card {
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
        }
        .track-card:hover {
            transform: scale(1.01);
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
        }
        .metric {
            font-size: 1.1rem;
            margin-bottom: .3rem;
        }
    </style>
</head>

<body>
<header th:insert="~{elements/header :: header}"></header>

<main class="container py-5">
    <h2 class="text-center mb-4 fw-bold">🎵 Let's compare our tracks</h2>

    <!-- Форма введення ID треків -->
    <form action="/features" method="get" class="mb-5 shadow-sm p-4 bg-white rounded">
        <div class="row g-3 align-items-center justify-content-center">
            <div class="col-md-4">
                <input type="text" name="firstSongId" class="form-control"
                       placeholder="First track ID" required>
            </div>
            <div class="col-md-4">
                <input type="text" name="secondSongId" class="form-control"
                       placeholder="Second track id" required>
            </div>
            <div class="col-md-2 text-center">
                <button type="submit" class="btn btn-success w-100">Compare</button>
            </div>
        </div>
        <p class="text-center text-muted mt-3 mb-0">
            For example, you can take ID's from Genius API:
            <code>First id = 791921 | Second id = 4043785</code>
        </p>
    </form>

    <!-- Треки -->
    <div class="row mb-5 text-center">
        <div class="col-md-6 mb-4">
            <div class="card track-card shadow">
                <img th:src="${firstTrack.get('headerImageUrl').asText()}" class="card-img-top shadow-lg" alt="First track cover">
                <div class="card-body">
                    <h4 class="card-title" th:text="${firstTrack.get('title')}"></h4>
                    <p class="text-muted mb-1" th:text="${firstTrack.get('artist')}"></p>
                    <p class="text-secondary" th:text="${firstTrack.get('releaseYear')}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card track-card shadow">
                <img th:src="${secondTrack.get('headerImageUrl').asText()}" class="card-img-top shadow-lg" alt="Second track cover">
                <div class="card-body">
                    <h4 class="card-title" th:text="${secondTrack.get('title')}"></h4>
                    <p class="text-muted mb-1" th:text="${secondTrack.get('artist')}"></p>
                    <p class="text-secondary" th:text="${secondTrack.get('releaseYear')}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Загальна схожість -->
    <div class="text-center mb-5">
        <h3>Overall similarity score:</h3>
        <h1 class="text-success fw-bold" th:text="${similarityScore + '%'}"></h1>
    </div>

    <!-- Метрики схожості -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="p-4 bg-white rounded shadow-sm">
                <h5 class="fw-bold mb-3">🎧 Similarity metrics</h5>
                <p class="metric" th:text="'Cosinus similarity: ' + ${similarityMetrics.get('cosine_similarity_percent')} + '%'"></p>
                <p class="metric" th:text="'Euclidean similarity: ' + ${similarityMetrics.get('euclidean_similarity_percent')} + '%'"></p>
                <p class="metric" th:text="'Color similarity: ' + ${similarityMetrics.get('color_similarity_percent')} + '%'"></p>
            </div>
        </div>
        <div class="col-md-6">
            <div class="p-4 bg-white rounded shadow-sm">
                <h5 class="fw-bold mb-3">🌟 Popularity</h5>
                <p class="metric" th:text="'Pyongs of the first track: ' + ${popularityFactors.get('first_song_pyongs')}"></p>
                <p class="metric" th:text="'Pyongs of the second track: ' + ${popularityFactors.get('second_song_pyongs')}"></p>
                <p class="metric" th:text="'Annotation similarity: ' + ${popularityFactors.get('annotation_similarity_percent')} + '%'"></p>
            </div>
        </div>
    </div>

    <!-- Стильові та часові характеристики -->
    <div class="row">
        <div class="col-md-6">
            <div class="p-4 bg-white rounded shadow-sm">
                <h5 class="fw-bold mb-3">🎨 Stylistic features</h5>
                <p class="metric" th:text="'Language similarity: ' + ${styleFeatures.get('language_similarity_percent')} + '%'"></p>
                <p class="metric" th:text="'Album cover main color similarity: ' + ${styleFeatures.get('primary_color_similarity_percent')} + '%'"></p>
            </div>
        </div>
        <div class="col-md-6">
            <div class="p-4 bg-white rounded shadow-sm">
                <h5 class="fw-bold mb-3">🕒 Timeline features</h5>
                <p class="metric" th:text="'Difference in years: ' + ${temporalFeatures.get('year_difference').asText()}"></p>
                <p class="metric" th:text="'Similarity by release year: ' + ${temporalFeatures.get('release_year_similarity_percent')} + '%'"></p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
